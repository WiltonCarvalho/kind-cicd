volumes:
  oracle-free-data:
  oracle-free-wallets:
services:
  server:
    image: container-registry.oracle.com/database/free:23.26.4.0-lite
    volumes:
      - oracle-free-data:/opt/oracle/oradata
      - oracle-free-wallets:/opt/oracle/oradata/wallets
    environment:
      ORACLE_PDB: FREEPDB1
      ORACLE_PWD: passw0rd
      ORACLE_CHARACTERSET: AL32UTF8
      ENABLE_ARCHIVELOG: true
      ENABLE_FORCE_LOGGING: true
    ports:
      - 1521:1521
      - 2484:2484
  client:
    build: oracle-client
    working_dir: /root
    entrypoint:
      - bash
      - -c
      - |
        ln -sf /proc/self/fd/1 /tmp/stdout.log
        ln -sf /proc/self/fd/2 /tmp/stderr.log
        >/tmp/stdout.log 2>/tmp/stderr.log exec sleep infinity &
        pid="$$!"
        echo "[ Started PID $$pid ]"
        trap "kill -term $$pid && echo '[ Stopped PID $$pid ]'" TERM
        wait $$pid
    volumes:
      - oracle-free-wallets:/opt/oracle/oradata/wallets
      - ./mtls:/tmp/mtls
      - ./human_resources:/tmp/human_resources
  java:
    # Java JDBC
    # docker-compose exec -it java java -cp ".:ojdbc17.jar:oraclepki.jar" JdbcExample
    build: java
    environment:
      ORACLE_USER: "hr"
      ORACLE_PASSWORD: "hr_passw0rd"
      ORACLE_JDBC_URL: "jdbc:oracle:thin:@tcps://server:2484/FREEPDB1?wallet_location=/opt/oracle/oradata/wallets/client1&ssl_server_dn_match=on"
    working_dir: /app
    entrypoint:
      - bash
      - -c
      - |
        ln -sf /proc/self/fd/1 /tmp/stdout.log
        ln -sf /proc/self/fd/2 /tmp/stderr.log
        >/tmp/stdout.log 2>/tmp/stderr.log exec sleep infinity &
        pid="$$!"
        echo "[ Started PID $$pid ]"
        trap "kill -term $$pid && echo '[ Stopped PID $$pid ]'" TERM
        wait $$pid
    volumes:
      - oracle-free-wallets:/opt/oracle/oradata/wallets
  nodejs:
    # nodejs oracledb
    # docker-compose exec -it nodejs node server.js
    build: nodejs
    restart: no
    volumes:
      - oracle-free-wallets:/opt/oracle/oradata/wallets
    environment:
      DB_USER: "hr"
      DB_PASSWORD: "hr_passw0rd"
      DB_CONNECT_STRING: "tcps://server:2484/FREEPDB1?wallet_location=/opt/oracle/oradata/wallets/client1&ssl_server_dn_match=on"
      #DB_CONNECT_STRING: "server:1521/FREEPDB1"
    entrypoint:
      - bash
      - -c
      - |
        ln -sf /proc/self/fd/1 /tmp/stdout.log
        ln -sf /proc/self/fd/2 /tmp/stderr.log
        >/tmp/stdout.log 2>/tmp/stderr.log exec sleep infinity &
        pid="$$!"
        echo "[ Started PID $$pid ]"
        trap "kill -term $$pid && echo '[ Stopped PID $$pid ]'" TERM
        wait $$pid
  dotnet:
    # dotnet oracledb
    # docker-compose exec -it dotnet dotnet OracleDbExample.dll
    build: dotnet
    restart: no
    volumes:
      - oracle-free-wallets:/opt/oracle/oradata/wallets
    environment:
      ORACLE_USER: "hr"
      ORACLE_PASSWORD: "hr_passw0rd"
      ORACLE_DATA_SOURCE: "tcps://server:2484/FREEPDB1?wallet_location=/opt/oracle/oradata/wallets/client1&ssl_server_dn_match=on"
    entrypoint:
      - bash
      - -c
      - |
        ln -sf /proc/self/fd/1 /tmp/stdout.log
        ln -sf /proc/self/fd/2 /tmp/stderr.log
        >/tmp/stdout.log 2>/tmp/stderr.log exec sleep infinity &
        pid="$$!"
        echo "[ Started PID $$pid ]"
        trap "kill -term $$pid && echo '[ Stopped PID $$pid ]'" TERM
        wait $$pid